name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
        python -m pip install pyinstaller

    - name: Run Unit Tests
      shell: bash
      run: |
        python -m pytest -v

    - name: Test Cross-Platform Build Script (build.sh)
      shell: bash
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Smoke Test & Package Executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        set +e
        BIN='./dist/PDF Parser Light.app/Contents/MacOS/PDF Parser Light'
        OUT=$(mktemp)
        ERR=$(mktemp)
        "$BIN" --usage >"$OUT" 2>"$ERR"
        CODE=$?
        echo "=== macOS smoke stdout ==="
        cat "$OUT"
        echo "=== macOS smoke stderr ==="
        cat "$ERR"
        echo "=== macOS smoke exit code: $CODE ==="
        if [ "$CODE" -ne 0 ]; then
          echo "macOS smoke test failed with exit code $CODE"
          exit 1
        fi
        cp GETTING_STARTED.txt dist/
        cd dist
        zip -r pdf-parser-light-macos.zip "PDF Parser Light.app" GETTING_STARTED.txt

    - name: Smoke Test & Package Executable (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $outFile = Join-Path $env:RUNNER_TEMP "smoke-out.txt"
        $errFile = Join-Path $env:RUNNER_TEMP "smoke-err.txt"
        $proc = Start-Process -FilePath "dist\PDF Parser Light.exe" -ArgumentList "--usage" `
          -RedirectStandardOutput $outFile -RedirectStandardError $errFile -PassThru -Wait
        Write-Host "=== Windows smoke stdout ==="
        if (Test-Path $outFile) { Get-Content $outFile }
        Write-Host "=== Windows smoke stderr ==="
        if (Test-Path $errFile) { Get-Content $errFile }
        Write-Host "=== Windows smoke exit code: $($proc.ExitCode) ==="
        if ($proc.ExitCode -ne 0) {
            Write-Error "Windows smoke test failed with exit code $($proc.ExitCode)"
            exit 1
        }
        Copy-Item GETTING_STARTED.txt -Destination dist/
        cd dist
        Compress-Archive -Path "PDF Parser Light.exe", "GETTING_STARTED.txt" -DestinationPath pdf-parser-light-windows.zip

    - name: Smoke Test & Package Executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        set +e
        OUT=$(mktemp)
        ERR=$(mktemp)
        xvfb-run --auto-servernum ./dist/"PDF Parser Light" --usage >"$OUT" 2>"$ERR"
        CODE=$?
        echo "=== Linux smoke stdout ==="
        cat "$OUT"
        echo "=== Linux smoke stderr ==="
        cat "$ERR"
        echo "=== Linux smoke exit code: $CODE ==="
        if [ "$CODE" -ne 0 ]; then
          echo "Linux smoke test failed with exit code $CODE"
          exit 1
        fi
        cp GETTING_STARTED.txt dist/
        cd dist
        tar -czvf pdf-parser-light-linux.tar.gz "PDF Parser Light" GETTING_STARTED.txt



    - name: Upload Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: dist/pdf-parser-light-macos.zip

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: dist/pdf-parser-light-windows.zip

    - name: Upload Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: linux-app
        path: dist/pdf-parser-light-linux.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir release_assets
          find artifacts -type f -exec mv {} release_assets/ \;
          cd release_assets && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
