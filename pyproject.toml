[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-parser-light"
version = "0.1.0"
description = "PDF Parser Light using CustomTkinter and Gemini API"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.2",
    "google-genai>=0.1.0",
    "pypdf>=4.0.0",
    "tkinterdnd2-universal>=1.7.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pdf-parser-light = "pdf_parser_light.cli:main"
pdf-parser-light-gui = "pdf_parser_light.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

